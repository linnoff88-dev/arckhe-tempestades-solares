 <text x="85" y="105" font-size="64" fill="#e9f2ff" font-family="DejaVu Sans,sans-serif" font-weight="bold">CHANCE DE QUÊ, EXATAMENTE?</text><text x="88" y="163" font-size="29" fill="#99c8dd" font-family="DejaVu Sans,sans-serif" font-weight="bold">O resultado precisa ser definido antes de falar em probabilidade.</text><text x="105" y="340" font-size="160" fill="#ffce71" font-family="DejaVu Sans,sans-serif" font-weight="bold">G5</text><text x="460" y="330" font-size="48" fill="#e9f2ff" font-family="DejaVu Sans,sans-serif" font-weight="bold">CATEGORIA EXTREMA</text><text x="460" y="405" font-size="38" fill="#e9f2ff" font-family="DejaVu Sans,sans-serif" font-weight="bold">~4 ocorrências por ciclo de 11 anos</text><rect x="95" y="530" width="1200" height="195" rx="24" fill="#142b45" stroke="#42617c" stroke-width="2"/><text x="125" y="610" font-size="65" fill="#e9f2ff" font-family="DejaVu Sans,sans-serif" font-weight="bold">G5 ≠ CARRINGTON</text><text x="125" y="680" font-size="59" fill="#ffce71" font-family="DejaVu Sans,sans-serif" font-weight="bold">G5 ≠ APAGÃO MUNDIAL</text><text x="105" y="850" font-size="37" fill="#e9f2ff" font-family="DejaVu Sans,sans-serif" font-weight="bold">Frequência do fenômeno não é chance de catástrofe.</text><text x="105" y="915" font-size="36" fill="#a8cde0" font-family="DejaVu Sans,sans-serif" font-weight="bold">A consequência depende também da infraestrutura.</text>
